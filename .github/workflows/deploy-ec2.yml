name: TECHIT Backend — Deploy to EC2

on:
  push:
    branches: [main]
  # Manual re-deploy so ops can reconcile the box without an empty commit.
  workflow_dispatch:

# Never let two deployments race the same working tree.
concurrency:
  group: backend-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          # RS256 signing material. The box ran pre-RS256 code until the deploy
          # fix rolled it forward to a main that requires RS256, so these must be
          # provisioned or every token is rejected. The private key stays on the
          # backend (it signs); the public key is shared with the verifiers.
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          # PostgreSQL request authority (AWS RDS), shared Redis (ElastiCache),
          # and the Plugins-MCP Postgres store + encryption key. The DB driver is
          # a repo variable so the sqlite -> postgres cutover is an explicit,
          # reversible switch rather than an implicit side effect of a deploy.
          PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MCP_SECRET_KEY: ${{ secrets.MCP_SECRET_KEY }}
          DB_DRIVER: ${{ vars.PLATFORM_DB_DRIVER || 'sqlite' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,PLATFORM_DATABASE_URL,REDIS_URL,MCP_SECRET_KEY,DB_DRIVER
          # Stop the whole script on the first failure. Historically this
          # defaulted to false, so a blocked `git pull` was followed by
          # `pm2 restart` + "✅ Backend deployed" and the job reported success
          # while the box silently kept running old code (which is why the
          # /health, /ready and /api/mcp probes were never actually live).
          script_stop: true
          script: |
            set -e
            cd ~/BACKEND

            # --- reconcile the working tree ----------------------------------
            # In-flight edits on the box (messaging hotfixes, a package-lock
            # rewritten by `npm install`, …) make `git pull` abort with
            # "local changes would be overwritten". Preserve them in a stash so
            # nothing is lost, then force the checkout to exactly the commit CI
            # validated.
            git fetch https://techit360ai-bit@github.com/techit360ai-bit/BACKEND.git main
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --include-untracked -m "autostash pre-deploy $(date -u +%FT%TZ)" || true
            fi
            git checkout main
            git reset --hard FETCH_HEAD
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "deploying $DEPLOYED_SHA"

            # --- build identity ----------------------------------------------
            # /health, /ready and the platform drift gate read GIT_SHA so the
            # deployed commit is verifiable rather than assumed. Record it in
            # the app env file and pass it to the process.
            node -e '
              const fs = require("fs");
              const p = "backend/.env";
              let s = "";
              try { s = fs.readFileSync(p, "utf8"); } catch {}
              const line = "GIT_SHA=" + process.argv[1];
              s = /^GIT_SHA=.*$/m.test(s)
                ? s.replace(/^GIT_SHA=.*$/m, line)
                : s.replace(/\s*$/, "") + "\n" + line + "\n";
              fs.writeFileSync(p, s);
            ' "$DEPLOYED_SHA"

            # --- platform env (PostgreSQL + Redis + MCP) ---------------------
            # Merge the committed, secret-free production template with the
            # secrets injected above. DB_DRIVER drives every read/write source
            # switch, so this is safe to run before the data cutover: with
            # PLATFORM_DB_DRIVER unset it defaults to sqlite and the box keeps
            # serving from SQLite while the RDS URL is staged.
            if [ -n "$PLATFORM_DATABASE_URL" ]; then
              # MCP mounts at boot and validates its encryption key immediately;
              # an empty key crashes the whole backend, so fail the deploy first.
              if [ -z "$MCP_SECRET_KEY" ]; then
                echo "❌ MCP_SECRET_KEY secret is not set but MCP_ENABLED=true"; exit 1
              fi
              DB_DRIVER="${DB_DRIVER:-sqlite}" node ops/ec2/sync-env.mjs \
                --template ops/ec2/platform.env --target backend/.env
            else
              echo "⚠️ PLATFORM_DATABASE_URL secret not set; leaving platform env unchanged"
            fi

            # Ensure the RS256 signing/verification material is present. Written
            # only when the deploy secrets are configured, and idempotent so the
            # box env never accumulates duplicate entries.
            node -e '
              const fs = require("fs");
              const priv = process.env.JWT_PRIVATE_KEY;
              const pub = process.env.JWT_PUBLIC_KEY;
              if (!priv || !pub) { console.log("JWT secrets not provided; leaving env unchanged"); process.exit(0); }
              const p = "backend/.env";
              let s = "";
              try { s = fs.readFileSync(p, "utf8"); } catch {}
              const upsert = (k, v) => {
                const re = new RegExp("^" + k + "=.*$", "m");
                s = re.test(s) ? s.replace(re, () => k + "=" + v) : s.replace(/\s*$/, "") + "\n" + k + "=" + v + "\n";
              };
              upsert("JWT_PRIVATE_KEY", priv);
              upsert("JWT_PUBLIC_KEY", pub);
              upsert("JWT_ALGORITHM", "RS256");
              fs.writeFileSync(p, s);
              fs.chmodSync(p, 0o600);
              console.log("jwt RS256 material ensured");
            '

            npm install --workspaces --if-present
            GIT_SHA="$DEPLOYED_SHA" pm2 restart techit-backend --update-env

            # --- verify the deploy actually landed ---------------------------
            for _ in $(seq 1 15); do
              if curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            # If the app is not serving, dump the pm2 log so the crash is
            # diagnosable from CI instead of requiring box access.
            if ! curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then
              echo "--- pm2 logs (last 120 lines) ---"
              pm2 logs techit-backend --lines 120 --nostream || true
              echo "--- pm2 describe ---"
              pm2 describe techit-backend | sed -n '1,40p' || true
            fi
            HEALTH="$(curl -fsS https://backend.techitnetwork.com/health)"
            echo "health: $HEALTH"
            if echo "$HEALTH" | grep -q "\"sha\":\"unknown\""; then
              echo "⚠️ /health reports sha=unknown; build-identity drift cannot be enforced on this host"
            elif ! echo "$HEALTH" | grep -q "\"sha\":\"$DEPLOYED_SHA\""; then
              echo "❌ /health sha does not match the deployed commit $DEPLOYED_SHA"
              exit 1
            fi

            READY_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/ready || true)"
            echo "/ready status: $READY_STATUS"
            if [ "$READY_STATUS" != "200" ]; then
              echo "⚠️ /ready is $READY_STATUS:"
              curl -s https://backend.techitnetwork.com/ready || true
              echo
            fi

            # MCP boundary: when the mount is on, every route is auth-gated, so
            # an anonymous probe must be 401 (/health) — that is the security
            # boundary the platform smoke asserts. If MCP is intentionally off
            # the route is absent (404); surface the state instead of failing.
            MCP_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/api/mcp/health || true)"
            echo "mcp /api/mcp/health status: $MCP_STATUS"
            if [ "$MCP_STATUS" = "404" ]; then
              echo "❌ MCP mount is disabled (MCP_ENABLED != true)."
              echo "   The platform env template provisions MCP_ENABLED=true; a 404 means the"
              echo "   env sync did not apply or the app booted without it. Investigate before"
              echo "   reporting a successful deploy — the platform smoke gate asserts 401 here."
              exit 1
            elif [ "$MCP_STATUS" != "401" ] && [ "$MCP_STATUS" != "200" ]; then
              echo "❌ MCP boundary returned $MCP_STATUS; expected 401 (anonymous) or 200"
              exit 1
            fi

            echo "✅ Backend deployed $DEPLOYED_SHA"
