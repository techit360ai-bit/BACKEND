name: TECHIT Backend — Deploy to EC2

on:
  push:
    branches: [main]
  # Manual re-deploy so ops can reconcile the box without an empty commit.
  workflow_dispatch:

# Never let two deployments race the same working tree.
concurrency:
  group: backend-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          # RS256 signing material. The box ran pre-RS256 code until the deploy
          # fix rolled it forward to a main that requires RS256, so these must be
          # provisioned or every token is rejected. The private key stays on the
          # backend (it signs); the public key is shared with the verifiers.
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          # PostgreSQL request authority (AWS RDS), shared Redis (ElastiCache),
          # and the Plugins-MCP Postgres store + encryption key. The DB driver is
          # a repo variable so the sqlite -> postgres cutover is an explicit,
          # reversible switch rather than an implicit side effect of a deploy.
          PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MCP_SECRET_KEY: ${{ secrets.MCP_SECRET_KEY }}
          DB_DRIVER: ${{ vars.PLATFORM_DB_DRIVER || 'sqlite' }}
          # The box's real legacy SQLite store (the committed template path is
          # the generic /var/lib location, which does not exist here).
          SQLITE_DB_PATH: /home/ubuntu/backend-data/techit.db
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,PLATFORM_DATABASE_URL,REDIS_URL,MCP_SECRET_KEY,DB_DRIVER,SQLITE_DB_PATH
          # `set -e` at the top of the script aborts on the first failure.
          # appleboy/ssh-action v1 no longer declares `script_stop` (it was
          # being ignored with an "unexpected input" warning), and the default
          # 10m command timeout cut the job off while it dumped a boot crash.
          command_timeout: 20m
          script: |
            set -e
            cd ~/BACKEND

            # --- reconcile the working tree ----------------------------------
            # In-flight edits on the box (messaging hotfixes, a package-lock
            # rewritten by `npm install`, …) make `git pull` abort with
            # "local changes would be overwritten". Preserve them in a stash so
            # nothing is lost, then force the checkout to exactly the commit CI
            # validated.
            # Egress to GitHub is occasionally flaky on this box (SSL handshake
            # resets/timeouts, and once a 17-minute hang). Retry with a hard
            # per-attempt timeout so the deploy self-heals instead of hanging
            # until the SSH command timeout and never reaching the pm2 restart.
            git config --global http.version HTTP/1.1 || true
            fetch_ok=0
            for attempt in 1 2 3 4 5; do
              if timeout 180 git fetch --no-tags https://techit360ai-bit@github.com/techit360ai-bit/BACKEND.git main; then
                fetch_ok=1
                break
              fi
              echo "⚠️ git fetch attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            if [ "$fetch_ok" != "1" ]; then echo "❌ git fetch failed after 5 attempts"; exit 1; fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --include-untracked -m "autostash pre-deploy $(date -u +%FT%TZ)" || true
            fi
            git checkout main
            git reset --hard FETCH_HEAD
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "deploying $DEPLOYED_SHA"

            # --- build identity ----------------------------------------------
            # /health, /ready and the platform drift gate read GIT_SHA so the
            # deployed commit is verifiable rather than assumed. Record it in
            # the app env file and pass it to the process.
            node -e '
              const fs = require("fs");
              const p = "backend/.env";
              let s = "";
              try { s = fs.readFileSync(p, "utf8"); } catch {}
              const line = "GIT_SHA=" + process.argv[1];
              s = /^GIT_SHA=.*$/m.test(s)
                ? s.replace(/^GIT_SHA=.*$/m, line)
                : s.replace(/\s*$/, "") + "\n" + line + "\n";
              fs.writeFileSync(p, s);
            ' "$DEPLOYED_SHA"

            # --- DevOps-managed DB credential --------------------------------
            # The RDS password is owned and rotated by DevOps, so the repo
            # secret can lag behind. The canonical on-box credential (bootstrapped
            # from the working service env) is the source of truth when present;
            # it is normalised to the node-pg sslmode because pg 8.23 verifies
            # certs under `require` while RDS presents the AWS CA.
            if [ -s "$HOME/.techit/platform-database-url" ]; then
              PLATFORM_DATABASE_URL="$(CRED="$(cat "$HOME/.techit/platform-database-url")" node -e '
                const u = new URL(process.env.CRED);
                u.searchParams.set("sslmode", "no-verify");
                process.stdout.write(u.toString());
              ')"
            fi

            # --- PgBouncer (transaction pooling) in front of RDS -------------
            # Collapse every client's connection fan-out (backend + ai-router +
            # Celery workers + Go messaging) behind one transaction-pooling
            # proxy, so RDS sees a fixed connection count no matter how many app
            # processes exist. Best-effort: if provisioning fails the backend
            # keeps talking to RDS directly (the pre-PgBouncer path), so a failed
            # apt/pgbouncer start can never take the service down.
            PGBOUNCER_READY=0
            if [ -s "$HOME/.techit/platform-database-url" ]; then
              if sudo bash ops/ec2/pgbouncer/setup.sh --credential-file "$HOME/.techit/platform-database-url" >/tmp/pgbouncer-setup.log 2>&1; then
                PGBOUNCER_READY=1
                echo "✅ PgBouncer up (transaction pooling); backend will use 127.0.0.1:6432"
              else
                echo "⚠️ PgBouncer provisioning failed; backend will use direct RDS"
                tail -n 40 /tmp/pgbouncer-setup.log || true
              fi
            fi
            if [ "$PGBOUNCER_READY" = "1" ]; then
              PLATFORM_DATABASE_URL="$(CRED="$PLATFORM_DATABASE_URL" node -e '
                const u = new URL(process.env.CRED);
                u.hostname = "127.0.0.1";
                u.port = "6432";
                // Local loopback hop: plain. PgBouncer terminates TLS to RDS.
                u.searchParams.set("sslmode", "disable");
                process.stdout.write(u.toString());
              ')"
            fi

            # --- platform env (PostgreSQL + Redis + MCP) ---------------------
            # Merge the committed, secret-free production template with the
            # secrets injected above. DB_DRIVER drives every read/write source
            # switch, so this is safe to run before the data cutover: with
            # PLATFORM_DB_DRIVER unset it defaults to sqlite and the box keeps
            # serving from SQLite while the RDS URL is staged.
            if [ -n "$PLATFORM_DATABASE_URL" ]; then
              # MCP mounts at boot and validates its encryption key immediately;
              # an empty key crashes the whole backend, so fail the deploy first.
              if [ -z "$MCP_SECRET_KEY" ]; then
                echo "❌ MCP_SECRET_KEY secret is not set but MCP_ENABLED=true"; exit 1
              fi
              DB_DRIVER="${DB_DRIVER:-sqlite}" node ops/ec2/sync-env.mjs \
                --template ops/ec2/platform.env --target backend/.env
            else
              echo "⚠️ PLATFORM_DATABASE_URL secret not set; leaving platform env unchanged"
            fi

            # Ensure the RS256 signing/verification material is present. Written
            # only when the deploy secrets are configured, and idempotent so the
            # box env never accumulates duplicate entries.
            node -e '
              const fs = require("fs");
              const priv = process.env.JWT_PRIVATE_KEY;
              const pub = process.env.JWT_PUBLIC_KEY;
              if (!priv || !pub) { console.log("JWT secrets not provided; leaving env unchanged"); process.exit(0); }
              const p = "backend/.env";
              let s = "";
              try { s = fs.readFileSync(p, "utf8"); } catch {}
              const upsert = (k, v) => {
                const re = new RegExp("^" + k + "=.*$", "m");
                s = re.test(s) ? s.replace(re, () => k + "=" + v) : s.replace(/\s*$/, "") + "\n" + k + "=" + v + "\n";
              };
              upsert("JWT_PRIVATE_KEY", priv);
              upsert("JWT_PUBLIC_KEY", pub);
              upsert("JWT_ALGORITHM", "RS256");
              fs.writeFileSync(p, s);
              fs.chmodSync(p, 0o600);
              console.log("jwt RS256 material ensured");
            '

            # --- ensure swap --------------------------------------------------
            # This box is memory-tight: `npm install --workspaces` for the
            # monorepo was OOM-killed (exit 137) and the kernel then killed the
            # running backend. Provision a swapfile once so installs and the
            # app survive memory spikes. Idempotent.
            if ! swapon --show 2>/dev/null | grep -q '/swapfile'; then
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi
              sudo swapon /swapfile || true
            fi
            swapon --show || true
            free -m || true

            # Non-fatal: node_modules is already on the box, so a failed install
            # (e.g. a memory spike) must not leave the service down.
            npm install --workspaces --if-present --no-audit --no-fund \
              || echo "⚠️ npm install failed; continuing with the existing node_modules"

            # The app must read backend/.env: a pm2 restart keeps the process's
            # stored environment, and env vars shadow `node --env-file`, so the
            # MCP contract was silently dropped and NODE_ENV stayed `staging`
            # while the probes expected production. Recreate the process with
            # the env file authoritative; the SSH-injected secrets still
            # override it through the process environment.
            pm2 delete techit-backend >/dev/null 2>&1 || true
            GIT_SHA="$DEPLOYED_SHA" pm2 start /usr/bin/node \
              --name techit-backend --cwd /home/ubuntu/BACKEND --interpreter none \
              -- --env-file-if-exists=backend/.env --import tsx backend/src/index.js
            pm2 save >/dev/null 2>&1 || true

            # --- verify the deploy actually landed ---------------------------
            for _ in $(seq 1 40); do
              if curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then break; fi
              sleep 3
            done
            # If the app is not serving, dump the pm2 log so a boot crash is
            # diagnosable from CI instead of requiring box access.
            if ! curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then
              # `pm2 logs --nostream` is unsupported on this box's pm2 and
              # streams forever (it hung the deploy until the command timeout),
              # so read the rotated log files directly instead.
              echo "--- pm2 status ---"
              pm2 describe techit-backend || true
              echo "--- techit-backend error log (last 150 lines) ---"
              timeout 15 tail -n 150 "$HOME/.pm2/logs/techit-backend-error.log" || true
              echo "--- techit-backend out log (last 150 lines) ---"
              timeout 15 tail -n 150 "$HOME/.pm2/logs/techit-backend-out.log" || true
            fi
            HEALTH="$(curl -fsS https://backend.techitnetwork.com/health)"
            echo "health: $HEALTH"
            if echo "$HEALTH" | grep -q "\"sha\":\"unknown\""; then
              echo "⚠️ /health reports sha=unknown; build-identity drift cannot be enforced on this host"
            elif ! echo "$HEALTH" | grep -q "\"sha\":\"$DEPLOYED_SHA\""; then
              echo "❌ /health sha does not match the deployed commit $DEPLOYED_SHA"
              exit 1
            fi

            READY_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/ready || true)"
            echo "/ready status: $READY_STATUS"
            if [ "$READY_STATUS" != "200" ]; then
              echo "⚠️ /ready is $READY_STATUS:"
              curl -s https://backend.techitnetwork.com/ready || true
              echo
            fi

            # MCP boundary: when the mount is on, every route is auth-gated, so
            # an anonymous probe must be 401 (/health) — that is the security
            # boundary the platform smoke asserts. If MCP is intentionally off
            # the route is absent (404); surface the state instead of failing.
            MCP_STATUS="$(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/api/mcp/health || true)"
            echo "mcp /api/mcp/health status: $MCP_STATUS"
            if [ "$MCP_STATUS" = "404" ]; then
              echo "❌ MCP mount is disabled (MCP_ENABLED != true)."
              echo "   The platform env template provisions MCP_ENABLED=true; a 404 means the"
              echo "   env sync did not apply or the app booted without it. Investigate before"
              echo "   reporting a successful deploy — the platform smoke gate asserts 401 here."
              exit 1
            elif [ "$MCP_STATUS" != "401" ] && [ "$MCP_STATUS" != "200" ]; then
              echo "❌ MCP boundary returned $MCP_STATUS; expected 401 (anonymous) or 200"
              exit 1
            fi

            echo "✅ Backend deployed $DEPLOYED_SHA"
