name: "Ops — EC2 box diagnostic (temporary)"
on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
jobs:
  diag:
    name: SSH read-only diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            echo "=== aws identity (box) ==="
            aws sts get-caller-identity 2>&1 | head -6
            echo "=== backend .env DATABASE_URL (RAW) ==="
            grep -aE "^DATABASE_URL=" /home/ubuntu/BACKEND/backend/.env 2>/dev/null
            echo "=== messaging .env (RAW) ==="
            grep -aE "DATABASE_URL|POSTGRES|PG" /home/ubuntu/BACKEND/messaging-backend/.env 2>/dev/null
            echo "=== ai-router .env (RAW) ==="
            grep -aE "DATABASE_URL" /home/ubuntu/ai-router/.env 2>/dev/null
            echo "=== ubuntu .env (RAW) ==="
            grep -aE "DATABASE_URL|PGPASSWORD" /home/ubuntu/.env 2>/dev/null
            echo "=== ~/.pgpass ==="
            cat /home/ubuntu/.pgpass 2>/dev/null || echo none
            echo "=== bash history psql/PGPASSWORD (RAW, last 25) ==="
            grep -aiE "PGPASSWORD|psql" /home/ubuntu/.bash_history 2>/dev/null | tail -25
            echo "=== psql on host? ==="
            command -v psql || echo no-psql
            echo "=== connectivity test using backend .env URL ==="
            URL="$(grep -aE '^DATABASE_URL=' /home/ubuntu/BACKEND/backend/.env | head -1 | cut -d= -f2- | tr -d '"'"'"'')"
            if command -v psql >/dev/null 2>&1; then
              psql "$URL" -tAc "select 'OK backend-env:'||current_user||'@'||current_database()" 2>&1 | head -3
            else
              docker run --rm -e PGURL="$URL" postgres:16 sh -c 'psql "$PGURL" -tAc "select 1"' 2>&1 | head -3
            fi
            echo "=== connectivity test with literal TechITSecure2026! ==="
            PGPASSWORD='TechITSecure2026!' psql "host=techit-postgres.czoo08wowahy.eu-west-1.rds.amazonaws.com port=5432 dbname=techit_db user=techit sslmode=no-verify connect_timeout=8" -tAc "select 'OK literal:'||current_user" 2>&1 | head -3
            echo "=== try ubuntu .env url ==="
            U2="$(grep -aoE 'postgres(ql)?://[^ '\''\"]+' /home/ubuntu/.env 2>/dev/null | head -1)"
            if [ -n "$U2" ]; then psql "$U2" -tAc "select 'OK ubuntu-env:'||current_user" 2>&1 | head -3; fi
