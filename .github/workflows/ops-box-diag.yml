name: "Ops — EC2 box diagnostic (temporary)"
on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
jobs:
  diag:
    name: Inspect pm2 env
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            echo "=== pm2 describe (script/cwd/args) ==="
            pm2 describe techit-backend 2>&1 | sed -n '1,45p'
            echo "=== pm2 process env (keys of interest) ==="
            pm2 env 0 2>/dev/null | grep -aE "^(NODE_ENV|MCP_ENABLED|MCP_STORE|DB_DRIVER|PLATFORM_DB_DRIVER|PLATFORM_DATABASE_URL|DATABASE_URL|MCP_DATABASE_URL|MCP_ENABLED_CONNECTORS|PLATFORM_REQUEST_AUTHORITY|PORT|REDIS_URL)=" | sed -E 's#(://[^:]+:)[^@]*@#\1***@#'
            echo "=== backend/.env (keys of interest) ==="
            grep -aE "^(NODE_ENV|MCP_ENABLED|MCP_STORE|DB_DRIVER|PLATFORM_DB_DRIVER|PLATFORM_DATABASE_URL|DATABASE_URL|MCP_DATABASE_URL|MCP_ENABLED_CONNECTORS|PLATFORM_REQUEST_AUTHORITY|PORT)=" /home/ubuntu/BACKEND/backend/.env | sed -E 's#(://[^:]+:)[^@]*@#\1***@#'
            echo "=== app log grep (mcp/error/validate) ==="
            pm2 logs techit-backend --lines 120 --nostream 2>&1 | grep -aiE "mcp|error|throw|validate|connector|refused" | tail -40
