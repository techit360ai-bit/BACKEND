name: "Ops — EC2 box diagnostic (temporary)"
on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
jobs:
  diag:
    name: Bootstrap canonical DB credential
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            mkdir -p "$HOME/.techit"
            CF="$HOME/.techit/platform-database-url"
            if [ -s "$CF" ]; then
              echo "canonical credential already present"
            else
              W="$(grep -aE '^DATABASE_URL=' /home/ubuntu/BACKEND/messaging-backend/.env | head -1 | cut -d= -f2- | sed -E "s/^[\"']//; s/[\"']$//")"
              if [ -n "$W" ]; then
                B="$W" node -e 'const u=new URL(process.env.B); u.searchParams.delete("sslmode"); process.stdout.write(u.toString())' > "$CF"
                chmod 600 "$CF"
                echo "bootstrapped canonical credential"
              else
                echo "ERROR: no working messaging credential found"
              fi
            fi
            echo "canonical bytes: $(wc -c < "$CF") sha256: $(sha256sum "$CF" | cut -c1-16)"
            T="$(B="$(cat "$CF")" node -e 'const u=new URL(process.env.B); u.searchParams.set("sslmode","require"); process.stdout.write(u.toString())')"
            psql "$T" -tAc "select 'CANON_OK user='||current_user||' db='||current_database()" 2>&1 | head -1
