name: "Ops — EC2 box diagnostic (temporary)"
on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
jobs:
  diag:
    name: Locate legacy sqlite stores
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            echo "=== sudo available? ==="
            sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
            echo "=== /home/ubuntu/backend-data ==="
            ls -la /home/ubuntu/backend-data 2>/dev/null
            echo "=== /var/lib/techit ==="
            ls -la /var/lib/techit 2>/dev/null || echo "absent"
            echo "=== sqlite/db files under /home/ubuntu (maxdepth 4) ==="
            find /home/ubuntu -maxdepth 4 \( -name '*.sqlite' -o -name '*.db' -o -name '*.sqlite3' \) -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -20
            echo "=== BACKEND sqlite refs in code defaults ==="
            grep -rhoaE "backend-data/[a-z0-9_.-]+|/var/lib/techit/[a-z0-9_./-]+" /home/ubuntu/BACKEND/backend/src 2>/dev/null | sort -u | head
