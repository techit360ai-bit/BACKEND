name: "Ops — EC2 box diagnostic (temporary)"
on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
jobs:
  diag:
    name: SSH read-only diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            R=eu-west-1
            echo "=== MasterUserSecret ==="
            aws rds describe-db-instances --db-instance-identifier techit-postgres --region $R \
              --query 'DBInstances[0].MasterUserSecret' --output json 2>&1
            echo "=== secrets manager names ==="
            aws secretsmanager list-secrets --region $R --query 'SecretList[].Name' --output text 2>&1 | tr '\t' '\n' | head -20
            echo "=== attached managed policies (techit-devops) ==="
            aws iam list-attached-user-policies --user-name techit-devops 2>&1 | head -30
            echo "=== inline policies ==="
            aws iam list-user-policies --user-name techit-devops 2>&1 | head -20
            echo "=== simulate rds:ModifyDBInstance ==="
            aws iam simulate-principal-policy \
              --policy-source-arn arn:aws:iam::936706106533:user/techit-devops \
              --action-names rds:ModifyDBInstance rds:DescribeDBInstances secretsmanager:GetSecretValue \
              --resource-arns arn:aws:rds:eu-west-1:936706106533:db:techit-postgres \
              --query 'EvaluationResults[].EvalDecision' --output text 2>&1 | head
