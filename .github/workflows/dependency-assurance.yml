name: Dependency Assurance

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependabot-policy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Block major and high-risk automatic updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [[ "$UPDATE_TYPE" == version-update:semver-major ]]; then
            echo "Major dependency updates require an engineer-led migration PR."
            exit 1
          fi
          if [[ "$DEPENDENCY_NAMES" =~ (pgx|go-redis|livekit|zod|express|jsonwebtoken|prisma|stripe) ]]; then
            echo "High-risk runtime/security dependencies require manual review."
            exit 1
          fi

  dependency-review:
    # dependency-review-action requires GitHub Advanced Security on private
    # repos (the dependency-graph compare API returns 403 without it). Skipping
    # the job on private repos silently disabled the gate where the sensitive
    # code lives, so private repos now run an equivalent lockfile-integrity gate
    # here while the node-audit job below enforces the vulnerability gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event.repository.private == true
        with:
          node-version: "22"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event.repository.private == false
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,AGPL-3.0-only
          # Three Vite dev-server advisories raised against the hoisted
          # rolldown-vite in BACKEND/frontend. That workspace is reference-only
          # with its deploy workflow disabled, so the code never runs in
          # production; `npm audit` rates the same lockfile 0 high because the
          # aliased package does not map to these GHSAs. Recorded as a visible,
          # narrow exception rather than suppressed - remove it when
          # BACKEND/frontend is retired.
          allow-ghsas: GHSA-p9ff-h696-f583,GHSA-v2wj-q39q-566r,GHSA-fx2h-pf6j-xcff
      - name: Private-repo dependency gate (GHAS substitute)
        if: github.event.repository.private == true
        run: |
          # Fails closed on a missing, malformed, or out-of-sync lockfile, which
          # is what silently broke this workflow on main.
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit for new high/critical findings
        run: |
          npm audit --audit-level=high --omit=dev --json > /tmp/npm-audit.json || true
          test -s /tmp/npm-audit.json
          node .github/scripts/npm-audit-regression.mjs
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          artifact-name: backend-sbom.spdx.json

  go-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: messaging-backend/go.sum
      - name: Audit Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd messaging-backend
          set +e
          "${HOME}/go/bin/govulncheck" ./... 2>&1 | tee /tmp/govulncheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then exit 0; fi
          grep -oE 'GO-[0-9-]+' /tmp/govulncheck.log | sort -u > /tmp/go-vulns.txt || true
          if [[ ! -s /tmp/go-vulns.txt ]]; then
            echo "govulncheck failed without a parseable advisory ID"
            exit "$status"
          fi
          unknown=$(comm -23 /tmp/go-vulns.txt <(sort ../.github/go-vuln-baseline.txt))
          if [[ -n "$unknown" ]]; then
            echo "New Go vulnerabilities detected:"
            echo "$unknown"
            exit 1
          fi
          echo "govulncheck regression gate passed; existing IDs are documented with an expiry-controlled review."

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
