name: "TECHIT Box — Legacy data locator (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Legacy data locator
    runs-on: ubuntu-latest
    steps:
      - name: Locate legacy data
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            echo "=== candidate db files ==="
            find /home/ubuntu -maxdepth 4 \( -name "*.db" -o -name "*.sqlite" -o -name "db.json" \) 2>/dev/null | head -20
            cd "$HOME/BACKEND"
            printf '%s' "" | base64 -d > .tmp-loc.mjs
            node .tmp-loc.mjs
            rm -f .tmp-loc.mjs
