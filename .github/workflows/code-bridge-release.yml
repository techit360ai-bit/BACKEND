name: Code Bridge Package

on:
  pull_request:
    branches: [main]
    paths: ["code-bridge/**", "package.json", "package-lock.json", ".github/workflows/code-bridge-release.yml"]
  push:
    tags: ["code-bridge-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test --prefix code-bridge
      - run: npm run pack:check --prefix code-bridge

  publish:
    if: startsWith(github.ref, 'refs/tags/code-bridge-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --prefix code-bridge --provenance --access restricted
