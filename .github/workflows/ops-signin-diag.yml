name: "TECHIT Box — Signin 500 diagnostic (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Signin diagnostic via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            echo "=== identity_postgres_read_failed (last 10) ==="
            grep -a "identity_postgres_read_failed" "$HOME/.pm2/logs/techit-backend-error.log" | tail -10
            echo "=== recent error log (last 50) ==="
            tail -n 50 "$HOME/.pm2/logs/techit-backend-error.log"
            echo "=== DB probe: core_* schema ==="
            cd "$HOME/BACKEND"
            node --input-type=module - <<'JS'
import fs from 'node:fs'
import pg from 'pg'
const env = fs.readFileSync('backend/.env','utf8')
const m = env.match(/^DATABASE_URL=(.*)$/m)
const url = m ? m[1].replace(/^"|"$/g,'') : ''
if (!url) { console.log('no DATABASE_URL'); process.exit(0) }
const c = new pg.Client({ connectionString: url, ssl: /sslmode=require/.test(url) ? { rejectUnauthorized:false } : undefined })
try {
  await c.connect()
  const t = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'core\\_%' ORDER BY table_name")
  console.log('core_* tables:', t.rows.map(r=>r.table_name).join(', ') || '(none)')
  for (const n of ['core_users','core_profiles','core_user_roles','core_active_contexts']) {
    try { const r = await c.query('SELECT count(*)::int AS n FROM ' + n); console.log(n, 'rows=', r.rows[0].n) }
    catch(e){ console.log(n, 'ERROR:', e.message) }
  }
} catch(e) { console.log('connect_error:', e.message) } finally { await c.end().catch(()=>{}) }
JS
