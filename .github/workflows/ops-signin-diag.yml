name: "TECHIT Box — Signin 500 diagnostic (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Signin diagnostic via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            echo "=== identity_postgres_read_failed (last 10) ==="
            grep -a "identity_postgres_read_failed" "$HOME/.pm2/logs/techit-backend-error.log" | tail -10
            echo "=== backend error log (last 60) ==="
            tail -n 60 "$HOME/.pm2/logs/techit-backend-error.log"
            echo "=== core_* schema probe ==="
            printf '%s' "" | base64 -d > "$HOME/BACKEND/.tmp-signin-diag.mjs"
            cd "$HOME/BACKEND"
            node .tmp-signin-diag.mjs
            rm -f .tmp-signin-diag.mjs
