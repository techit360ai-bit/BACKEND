name: "TECHIT Box — SQLite backup probe (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: backup probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== all techit backups on box ==="; find /home/ubuntu -maxdepth 4 -name "techit.db*" 2>/dev/null
            cd "$HOME/BACKEND"
            printf '%s' "" | base64 -d > .tmp-bk.mjs
            node .tmp-bk.mjs
            rm -f .tmp-bk.mjs
