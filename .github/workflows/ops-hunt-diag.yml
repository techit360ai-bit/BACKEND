name: "TECHIT Box — Legacy data hunt (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: hunt
    runs-on: ubuntu-latest
    steps:
      - name: Hunt
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            printf '%s' "" | base64 -d > /tmp/hunt.sh
            bash /tmp/hunt.sh
