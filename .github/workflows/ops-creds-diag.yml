name: TECHIT Box — Credential diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    name: Credential fingerprints via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            cd ~/BACKEND
            echo "=== on-box credential file ==="
            ls -la "$HOME/.techit/" 2>&1 | sed 's/ [^ ]*$//' || true
            if [ -s "$HOME/.techit/platform-database-url" ]; then echo "exists=yes size=$(wc -c <"$HOME/.techit/platform-database-url")"; else echo "exists=NO"; fi
            echo "=== fingerprint helper (host/user/db/pwhash only) ==="
            fp() {
              node -e '
                const s=process.argv[1]; if(!s){console.log("(empty)");process.exit(0)}
                try{const u=new URL(s);const crypto=require("crypto");
                  const pw=decodeURIComponent(u.password||"");
                  const h=crypto.createHash("sha256").update(pw).digest("hex").slice(0,10);
                  console.log(`host=${u.hostname} port=${u.port} user=${u.username} db=${u.pathname.replace(/^\//,"")} pwlen=${pw.length} pwsha=${h} sslmode=${u.searchParams.get("sslmode")}`);
                }catch(e){console.log("parse_error",e.message)}
              ' "$1"
            }
            echo "cred-file : $(fp "$(cat "$HOME/.techit/platform-database-url" 2>/dev/null)")"
            echo "=== backend/.env fingerprints ==="
            for k in PLATFORM_DATABASE_URL DATABASE_URL TRUST_DATABASE_URL IDENTITY_DATABASE_URL MCP_DATABASE_URL DISCOVERY_DATABASE_URL; do
              v="$(grep -m1 "^$k=" backend/.env 2>/dev/null | cut -d= -f2-)"
              if [ -n "$v" ]; then echo "$k : $(fp "$v")"; else echo "$k : (absent)"; fi
            done
            echo "=== ssh-injected PLATFORM_DATABASE_URL ==="
            echo "injected-env : ${PLATFORM_DATABASE_URL:+(set)}"
            echo "=== RDS reachability from box ==="
            timeout 8 bash -c 'exec 3<>/dev/tcp/techit-postgres.czoo08wowahy.eu-west-1.rds.amazonaws.com/5432' 2>&1 && echo "rds:5432 OPEN" || echo "rds:5432 closed"
