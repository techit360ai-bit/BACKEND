name: TECHIT Box — Reboot

# Last-resort recovery: reboot the EC2 host when it is thrashing (swap full,
# load 15+, nginx and pm2 unresponsive). Uses passwordless sudo, falling back
# to the EC2 API with the box's configured AWS credentials.

on:
  workflow_dispatch:

concurrency:
  group: backend-ec2-reboot
  cancel-in-progress: false

jobs:
  reboot:
    name: Reboot via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Reboot via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== before reboot ==="; uptime; free -m
            # IMDSv1 is disabled; get a token for the instance id/region.
            TOKEN="$(curl -s --max-time 5 -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 120')"
            echo "imds token length: ${#TOKEN}"
            md() { curl -s --max-time 5 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$1"; }
            INSTANCE_ID="$(md instance-id)"
            REGION="$(md placement/region)"
            echo "instance=[$INSTANCE_ID] region=[$REGION]"

            echo "=== aws cli ==="; command -v aws || echo "aws not installed"
            echo "=== caller identity ==="; timeout 25 aws sts get-caller-identity 2>&1 | head -8

            echo "=== attempt: sudo -n reboot ==="
            if timeout 20 sudo -n reboot; then echo "reboot issued via sudo"; exit 0; fi

            echo "=== attempt: EC2 API with box credentials ==="
            if [ -n "$INSTANCE_ID" ]; then
              timeout 90 aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" --region "${REGION:-eu-west-1}" 2>&1 | head -8 \
                && echo "reboot issued via EC2 API"
            fi
            echo "reboot not issued"
