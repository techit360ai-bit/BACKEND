name: TECHIT Messaging Backend — Test and Deploy

on:
  push:
    branches: [feat/messaging-backend]
  pull_request:
    branches: [feat/messaging-backend]

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: cd backend && go test ./... -short -timeout 30s
        env:
          JWT_SECRET: test-secret-ci-only
          DATABASE_URL: ""
          REDIS_URL: ""

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feat/messaging-backend' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_MESSAGING_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "✅ Messaging backend deploy triggered"
