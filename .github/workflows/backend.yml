name: TECHIT Backend Services

on:
  push:
    branches: [main, wave5/go-messaging-backend]
    paths:
      - "backend/**"
      - "messaging-backend/**"
      - "Plugins-MCP/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "messaging-backend/**"
      - "Plugins-MCP/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"

jobs:
  node-backend:
    name: Node Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment env contract
        run: npm run env:check
        env:
          NODE_ENV: production
          ENVIRONMENT: production
          PORT: "3000"
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_ISSUER: techit-backend
          JWT_AUDIENCE: techit-platform
          OTP_HASH_SECRET: 89abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567
          CORS_ORIGINS: https://app.techit.example
          FRONTEND_URL: https://app.techit.example
          DB_DRIVER: sqlite
          SQLITE_DB_PATH: /tmp/techit/backend/techit.sqlite
          RESEND_API_KEY: re_ci_contract_value
          FROM_EMAIL: TechIT <noreply@techit.example>
          MCP_ENABLED: "true"
          MCP_STORE: postgres
          MCP_DATABASE_URL: postgres://mcp_app:mcp_password@postgres.example:5432/techit_mcp?sslmode=require
          MCP_DATABASE_SSL: "true"
          MCP_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          MCP_ENABLED_CONNECTORS: github,notion,figma,web3
          MCP_ALLOW_FILE_STORE: "false"
          MCP_ALLOW_STUB_CONNECTORS: "false"
          MCP_SEED_DEMO_ACTIVITY: "false"
          MCP_APPROVAL_TTL_MS: "900000"
          GITHUB_CONNECTOR_MODE: real
          MCP_GITHUB_TOKEN: github_pat_ci_contract_value
          NOTION_CONNECTOR_MODE: real
          NOTION_TOKEN: secret_notion_ci_contract_value
          FIGMA_CONNECTOR_MODE: real
          FIGMA_TOKEN: figd_ci_contract_value
          WEB3_CONNECTOR_MODE: real
          WEB3_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          SIWE_EXPECTED_DOMAIN: app.techit.example
          SIWE_EXPECTED_URI: https://app.techit.example
          SIWE_EXPECTED_CHAIN_ID: "11155111"
          GITHUB_CLIENT_ID: github-ci-client
          GITHUB_CLIENT_SECRET: github-ci-secret-value
          GITHUB_REDIRECT_URI: https://api.techit.example/api/github/callback
          GITHUB_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AI_ROUTER_SETTLEMENT_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          AI_USAGE_GRANT_SERVICE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AI_EXECUTION_GRANT_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          DATABASE_URL: postgres://techit:secret@postgres.example:5432/techit_msg?sslmode=require
          REDIS_URL: rediss://redis.example:6379
          ENABLE_DEV_TOKEN: "0"

      - name: Validate messaging branch reconciliation
        run: npm run messaging:reconcile

      - name: Validate production runbook and observability gates
        run: npm run runbook:check

      - name: Validate security gate wiring
        run: npm run security:gates

      - name: Run Node backend tests
        run: npm test --prefix backend

  go-messaging-unit:
    name: Go Messaging Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: messaging-backend/go.sum

      - name: Run tests
        run: cd messaging-backend && go test ./... -short -timeout 30s
        env:
          JWT_SECRET: test-secret-ci-only
          DATABASE_URL: ""
          REDIS_URL: ""

  go-messaging-integration:
    name: Go Messaging Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techit_msg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: messaging-backend/go.sum

      - name: Dry-run PostgreSQL migrations
        run: cd messaging-backend && go run ./cmd/migrate -mode=dry-run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/techit_msg?sslmode=disable

      - name: Run DB-backed integration tests
        run: cd messaging-backend && go test -tags=integration ./... -timeout 60s
        env:
          JWT_SECRET: test-secret-ci-only
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/techit_msg?sslmode=disable
          TEST_REDIS_URL: redis://localhost:56379

  plugins-mcp:
    name: Plugins MCP Security Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techit_mcp
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techit_mcp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run MCP tests and typecheck
        run: npm test --prefix Plugins-MCP && npm run typecheck --prefix Plugins-MCP
        env:
          MCP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55433/techit_mcp
          MCP_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  deploy:
    name: Deploy Messaging to Render
    runs-on: ubuntu-latest
    needs: [node-backend, go-messaging-unit, go-messaging-integration, plugins-mcp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_MESSAGING_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Messaging backend deploy triggered"
