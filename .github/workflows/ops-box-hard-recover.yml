name: TECHIT Box — Hard Recover

# Frees memory on a thrashed box by force-killing node/pm2 and container
# processes, then restarts the backend from the local tree. Fetch-free.
# Bracket the pkill patterns so the script's own shell is never matched.

on:
  workflow_dispatch:

concurrency:
  group: backend-ec2-hard-recover
  cancel-in-progress: false

jobs:
  recover:
    name: Hard recover via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Hard recover via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MCP_SECRET_KEY: ${{ secrets.MCP_SECRET_KEY }}
          DB_DRIVER: ${{ vars.PLATFORM_DB_DRIVER || 'sqlite' }}
          SQLITE_DB_PATH: /home/ubuntu/backend-data/techit.db
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PLATFORM_DATABASE_URL,REDIS_URL,MCP_SECRET_KEY,DB_DRIVER,SQLITE_DB_PATH
          command_timeout: 20m
          script: |
            set +e
            echo "=== before ==="; uptime; free -m; df -h / | tail -1
            echo "=== top rss (MB) ==="; ps -eo pid,rss,pmem,comm --sort=-rss | head -15
            echo "=== total rss (MB) ==="; ps -eo rss= | awk '{s+=$1} END {print int(s/1024)}'

            echo "=== force-killing node + PM2 daemon ==="
            pkill -9 -x node || true
            pkill -9 -f 'PM[2] .*God Daemon' || true
            pkill -9 -x PM2 || true
            sleep 5

            echo "=== force-killing containers ==="
            CIDS="$(timeout 30 docker ps -q 2>/dev/null)"
            if [ -n "$CIDS" ]; then timeout 120 docker kill $CIDS 2>&1 | tail -5; fi
            sleep 5

            echo "=== after cleanup ==="; free -m

            echo "=== start backend from local tree ($(cd ~/BACKEND && git rev-parse --short HEAD)) ==="
            cd ~/BACKEND
            timeout 60 pm2 kill || true
            sleep 3
            GIT_SHA="$(git rev-parse HEAD)" timeout 180 pm2 start /usr/bin/node \
              --name techit-backend --cwd /home/ubuntu/BACKEND --interpreter none \
              -- --env-file-if-exists=backend/.env --import tsx backend/src/index.js
            timeout 30 pm2 save || true

            for _ in $(seq 1 30); do
              if curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then break; fi
              sleep 4
            done
            if ! curl -fsS https://backend.techitnetwork.com/health >/dev/null 2>&1; then
              echo "--- pm2 status ---"; timeout 30 pm2 describe techit-backend || true
              echo "--- error log ---"; timeout 15 tail -n 120 "$HOME/.pm2/logs/techit-backend-error.log" || true
              echo "--- out log ---"; timeout 15 tail -n 120 "$HOME/.pm2/logs/techit-backend-out.log" || true
              echo "=== final ==="; uptime; free -m
              exit 1
            fi
            echo "health: $(curl -fsS https://backend.techitnetwork.com/health)"
            echo "ready: $(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/ready)"
            echo "mcp: $(curl -s -o /dev/null -w '%{http_code}' https://backend.techitnetwork.com/api/mcp/health)"
            echo "=== final ==="; uptime; free -m
