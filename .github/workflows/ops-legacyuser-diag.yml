name: "TECHIT Box — Legacy user + backups (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Legacy user probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== pm2 env DB paths ==="; pm2 env 0 2>/dev/null | grep -E "SQLITE_DB_PATH|JSON_DB_PATH|DB_DRIVER|LEGACY_DB_DRIVER" | head
            cd "$HOME/BACKEND"
            printf '%s' "" | base64 -d > .tmp-lu.mjs
            node .tmp-lu.mjs
            rm -f .tmp-lu.mjs
