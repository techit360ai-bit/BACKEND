name: "TECHIT Box — app_collections probe (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: app_collections probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            cd "$HOME/BACKEND"
            printf '%s' "" | base64 -d > .tmp-ac.mjs
            node .tmp-ac.mjs
            rm -f .tmp-ac.mjs
