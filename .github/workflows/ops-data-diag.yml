name: "TECHIT Box — Data picture (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Data picture via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set +e
            grep -a "identity_postgres_read_failed" "$HOME/.pm2/logs/techit-backend-error.log" | tail -3
            cd "$HOME/BACKEND"
            printf '%s' "" | base64 -d > .tmp-data-diag.mjs
            node .tmp-data-diag.mjs
            rm -f .tmp-data-diag.mjs
