name: "Ops — RDS diagnostic (temporary)"

on:
  push:
    branches: [fix/rds-ssl-mode-and-diag]
  workflow_dispatch:

jobs:
  diag:
    name: Inspect RDS with repo AWS creds
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Identity
        run: aws sts get-caller-identity
      - name: RDS instances (eu-west-1)
        run: |
          aws rds describe-db-instances --region eu-west-1 \
            --query 'DBInstances[].{id:DBInstanceIdentifier,user:MasterUsername,db:DBName,endpoint:Endpoint.Address,status:DBInstanceStatus,public:PubliclyAccessible,multiAZ:MultiAZ}' \
            --output json
      - name: RDS clusters (eu-west-1)
        run: aws rds describe-db-clusters --region eu-west-1 --query 'DBClusters[].DBClusterIdentifier' --output json
