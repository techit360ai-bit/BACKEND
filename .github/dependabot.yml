version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-patch-minor:
        update-types: ["patch", "minor"]
  - package-ecosystem: gomod
    directory: /messaging-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-patch-minor:
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
